<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个股档案 · 高股息看板</title>
<meta name="description" content="个股高股息档案：股息率、每股分红、股息率参考价、近一年位置、分红明细，按最新数据实时计算。仅供参考，不构成投资建议。">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a0c0d;color:#fdf6ec;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 14px 30px}
  .topnav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;
    padding:10px 16px;background:rgba(26,12,13,.9);border-bottom:1px solid rgba(255,255,255,.08)}
  .topnav a.back2{color:rgba(253,246,236,.75);font-size:12.5px;text-decoration:none;margin-right:8px}
  .topnav a.back2:hover{color:#fdf6ec}
  .topnav .sp{flex:1}
  .topnav button.rf{height:30px;border-radius:9px;border:1px solid rgba(232,176,75,.45);
    background:rgba(232,176,75,.12);color:#e8b04b;font-size:12px;cursor:pointer;
    padding:0 12px;margin-right:8px;font-family:inherit}
  .topnav button.x{height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);color:#fdf6ec;font-size:12px;cursor:pointer;
    font-family:inherit;padding:0 11px}
  .host{width:100%;max-width:660px}
  .back{margin-top:14px;color:rgba(253,246,236,.55);font-size:12px;text-decoration:none;
    border-bottom:1px dashed rgba(253,246,236,.25)}
  .back:hover{color:#fdf6ec}
  .err{padding:60px 20px;text-align:center;color:rgba(253,246,236,.72)}
</style>
</head>
<body>
<div class="topnav">
  <a class="back2" href="index.html">返回看板</a>
  <div class="sp"></div>
  <button class="rf" id="rf2" title="重新取行情并重算">刷新行情</button>
  <button class="x" id="closeBtn" title="关闭">关闭</button>
</div>
<div class="host" id="host"></div>
<a class="back" href="index.html">返回看板</a>

<script src="site_data.js?v=20261017c"></script>
<script src="stock_card.js?v=20261017c"></script>
<script>
'use strict';
document.getElementById('rf2').addEventListener('click', function(){ location.reload(); });
document.getElementById('closeBtn').addEventListener('click', function(){
  window.close();
  setTimeout(function(){
    if (history.length > 1) history.back();
    else location.href = 'index.html';
  }, 120);
});

var code = new URLSearchParams(location.search).get('code') || '';
var r0 = (window.SITE_DATA.rows || []).filter(function(r){ return r.code === code; })[0];

function loadQuote(codes){
  return new Promise(function(resolve){
    var keys = codes.map(function(c){ return (c[0] === '6' ? 'sh' : 'sz') + c; });
    var s = document.createElement('script');
    s.charset = 'GBK';
    s.src = 'https://qt.gtimg.cn/q=' + keys.join(',');
    var out = {};
    s.onload = function(){
      keys.forEach(function(k, i){
        var raw = window['v_' + k];
        if (!raw) return;
        var p = String(raw).split('~');
        if (p.length < 49) return;
        out[codes[i]] = {price:+p[3]||null, chg:+p[32], pe:+p[39]||null,
          pb:+p[46]||null, hi:+p[47]||null, lo:+p[48]||null};
      });
      resolve(out); s.remove();
    };
    s.onerror = function(){ resolve(out); s.remove(); };
    document.head.appendChild(s);
    setTimeout(function(){ resolve(out); }, 6000);
  });
}

if (!r0){
  document.getElementById('host').innerHTML =
    '<div class="err">未找到该标的（code=' + code + '）</div>';
} else {
  document.title = r0.name + ' 股息档案 · 高股息看板';
  renderStockCard(document.getElementById('host'), r0, null, window.SITE_DATA.generated);
  loadQuote([code]).then(function(q){
    if (q[code]) renderStockCard(document.getElementById('host'), r0, q[code], window.SITE_DATA.generated);
  });
}
</script>
</body>
</html>
