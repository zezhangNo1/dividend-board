  /* ---- 个股档案卡组件（.scard）静态样式 ---- */
  .scard{--red-deep:#0C1712;--red:#14261E;--red-hi:#1D362A;--gold:#C9A75A;--gold-soft:rgba(201,167,90,.18);--cream:#F2F4EA;--cream2:rgba(242,244,234,.72);--cream3:rgba(242,244,234,.45);--panel:rgba(233,237,226,.07);--panel-line:rgba(233,237,226,.14);--up2:#E89A8F;--down2:#7FBF9C;border-radius:2px;overflow:hidden;color:var(--cream);font-size:13px;line-height:1.5;background:linear-gradient(165deg,var(--red-hi) 0%,var(--red) 45%,var(--red-deep) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.scard *{box-sizing:border-box;margin:0;padding:0}.scard .hd{display:flex;align-items:center;gap:10px;padding:14px 18px 11px;border-bottom:1px solid var(--panel-line)}.scard .mark{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--gold),#c9922f);color:#4a2408;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}.scard .hd .t1{font-size:14px;font-weight:700;letter-spacing:1px}.scard .hd .t2{font-size:11px;color:var(--cream3);margin-top:1px}.scard .hd .date{margin-left:auto;text-align:right;font-size:11px;color:var(--cream3)}.scard .hd .date b{display:block;color:var(--cream2);font-weight:600;font-size:12px}.scard .hero{display:flex;align-items:center;gap:18px;padding:18px 18px 16px;flex-wrap:wrap}.scard .hero .nm{font-size:28px;font-weight:800;letter-spacing:1px;line-height:1.2}.scard .hero .meta{font-size:12px;color:var(--cream3);margin-top:4px}.scard .hero .meta i{font-style:normal;border:1px solid var(--panel-line);border-radius:9px;padding:1px 8px;margin-right:6px;color:var(--cream2)}.scard .dybox{margin-left:auto;text-align:right}.scard .dybox .k{font-size:11px;color:var(--cream3)}.scard .dybox .v{font-size:36px;font-weight:800;color:var(--gold);line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(232,176,75,.35)}.scard .tier{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;border-radius:9px;padding:2px 10px}.scard .t-high{background:var(--gold);color:#4a2408}.scard .t-mid{background:rgba(255,255,255,.16);color:var(--cream)}.scard .t-low{background:rgba(255,255,255,.09);color:var(--cream2)}.scard .pxrow{display:flex;gap:8px;padding:0 18px 14px;flex-wrap:wrap}.scard .px{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:9px 13px}.scard .px .k{font-size:11px;color:var(--cream3)}.scard .px .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.scard .px .v small{font-size:11px;font-weight:400;color:var(--cream3);margin-left:2px}.scard .sec{padding:2px 18px 6px}.scard .sec h4{font-size:12px;color:var(--gold);letter-spacing:2px;margin:11px 0 7px;font-weight:700}.scard .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.scard .tp{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:7px 9px;text-align:center}.scard .tp .r{font-size:12px;font-weight:700;color:var(--gold)}.scard .tp .p{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.scard .tp .g{font-size:10.5px;margin-top:3px;color:var(--cream3);border-radius:7px;padding:1px 6px;display:inline-block}.scard .tp .g.hit{background:var(--gold-soft);color:var(--gold);font-weight:700}.scard .tp.now{outline:2px solid var(--gold);outline-offset:-2px}.scard .poswrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:9px 13px}.scard .poswrap .k{font-size:11px;color:var(--cream3);flex:none}.scard .bar2{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.28);position:relative}.scard .bar2 i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:linear-gradient(90deg,#7fd8a5,#e8b04b,#ff8f96)}.scard .poswrap .v{font-size:13px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}.scard table{width:100%;border-collapse:collapse}.scard td{padding:5px 4px;font-size:12px;border-bottom:1px dashed rgba(255,255,255,.09)}.scard tr:last-child td{border-bottom:none}.scard td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--cream)}.scard td:first-child{color:var(--cream2)}.scard td .tag{font-size:10px;border:1px solid var(--panel-line);border-radius:7px;padding:0 6px;margin-right:6px;color:var(--cream3)}.scard .calc{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:11px 14px;font-size:12px;color:var(--cream2);line-height:1.8}.scard .calc b{color:var(--gold);font-weight:700;font-size:14px}.scard .calc .note{font-size:10.5px;color:var(--cream3)}.scard .ft{padding:12px 18px 16px;font-size:10.5px;color:var(--cream3);line-height:1.7;border-top:1px solid var(--panel-line);margin-top:11px}@media (max-width:560px){.scard .hero .nm{font-size:22px}.scard .dybox .v{font-size:28px}.scard .tiers{grid-template-columns:repeat(2,1fr)}.scard .pxrow .px{min-width:calc(50% - 4px)}}

<script>
'use strict';
document.getElementById('rf2').addEventListener('click', function(){ location.reload(); });
document.getElementById('closeBtn').addEventListener('click', function(){
  window.close();
  setTimeout(function(){
    if (history.length > 1) history.back();
    else location.href = 'index.html';
  }, 120);
});

var code = new URLSearchParams(location.search).get('code') || '';
var r0 = (window.SITE_DATA.rows || []).filter(function(r){ return r.code === code; })[0];

function loadQuote(codes){
  return new Promise(function(resolve){
    var keys = codes.map(function(c){ return (c[0] === '6' ? 'sh' : 'sz') + c; });
    var s = document.createElement('script');
    s.charset = 'GBK';
    s.src = 'https://qt.gtimg.cn/q=' + keys.join(',');
    var out = {};
    s.onload = function(){
      keys.forEach(function(k, i){
        var raw = window['v_' + k];
        if (!raw) return;
        var p = String(raw).split('~');
        if (p.length < 49) return;
        out[codes[i]] = {price:+p[3]||null, chg:+p[32], pe:+p[39]||null,
          pb:+p[46]||null, hi:+p[47]||null, lo:+p[48]||null};
      });
      resolve(out); s.remove();
    };
    s.onerror = function(){ resolve(out); s.remove(); };
    document.head.appendChild(s);
    setTimeout(function(){ resolve(out); }, 6000);
  });
}

if (!r0){
  document.getElementById('host').innerHTML =
    '<div class="err">未找到该标的（code=' + code + '）</div>';
} else {
  document.title = r0.name + ' 股息档案 · 高股息看板';
  renderStockCard(document.getElementById('host'), r0, null, window.SITE_DATA.generated);
  loadQuote([code]).then(function(q){
    if (q[code]) renderStockCard(document.getElementById('host'), r0, q[code], window.SITE_DATA.generated);
  });
}
</script>
