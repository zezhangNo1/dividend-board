<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F7FB">
<title>FIRE 倒计时 · 泽克的数据笔记</title>
<meta name="description" content="输入存款、月支出和每月能存的钱，按 4% 法则算出你的财务自由倒计时。简化模型，仅供参考。">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#F5F7FB; --card:rgba(255,255,255,.78);
    --ink:#0F172A; --ink2:#5B6B82; --ink3:#93A1B5;
    --line:rgba(15,23,42,.09); --line-hi:rgba(37,99,235,.35);
    --blue:#2563EB; --violet:#7C3AED; --cyan:#0891B2; --cyan-hi:#06B6D4;
    --ease:cubic-bezier(.25,.8,.25,1); --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{
    background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .fw-wrap{max-width:720px;margin:0 auto;padding:0 clamp(14px,4vw,28px) 56px}

  .fw-head{
    position:relative;padding:40px 0 26px;overflow:hidden;
    background:radial-gradient(520px 300px at 85% -20%, rgba(8,145,178,.10), transparent 70%),
               radial-gradient(420px 260px at 0% -10%, rgba(37,99,235,.10), transparent 72%);
  }
  .fw-back{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    font-size:12px;color:var(--ink2);margin-bottom:16px;
    border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:#fff;
  }
  .fw-back:hover{color:var(--blue);border-color:var(--blue)}
  .fw-head h1{
    font-size:clamp(24px,4.4vw,32px);font-weight:800;letter-spacing:.5px;line-height:1.25;
    background:linear-gradient(100deg,#0F172A 20%,#0891B2 60%,#2563EB 105%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  }
  .fw-head p{color:var(--ink2);font-size:13px;margin-top:8px;max-width:62ch}
  .fw-head p b{color:var(--cyan)}

  /* 输入区 */
  .fw-form{margin-top:24px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
  .fw-field{
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:14px 18px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    min-width:0;
  }
  .fw-field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
  .fw-field label b{color:var(--ink)}
  .fw-field .row{display:flex;align-items:baseline;gap:8px}
  .fw-field input[type=number]{
    flex:1;min-width:0;border:none;background:transparent;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .fw-field input[type=number]:focus{outline:none}
  .fw-field .unit{font-size:13px;color:var(--ink3);flex:none}
  .fw-slider{display:flex;align-items:center;gap:14px}
  .fw-slider input[type=range]{
    flex:1;min-width:0;accent-color:var(--cyan);height:24px;cursor:pointer;
  }
  .fw-slider b{
    flex:none;font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;
    color:var(--cyan);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;
  }

  /* 结果 */
  .fw-out{margin-top:26px}
  .fw-card{
    border:1px solid var(--line);border-radius:22px;padding:26px clamp(18px,4vw,30px);
    background:
      radial-gradient(420px 260px at 92% 0%, rgba(8,145,178,.12), transparent 70%),
      radial-gradient(420px 260px at 0% 100%, rgba(37,99,235,.12), transparent 72%),
      linear-gradient(135deg,#FFFFFF,#F3FAFD);
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 20px 44px -26px rgba(15,23,42,.3);
  }
  .fw-card .tag{
    display:inline-block;font-size:10.5px;font-weight:700;color:var(--cyan);
    border:1px solid rgba(8,145,178,.3);background:rgba(8,145,178,.06);
    border-radius:999px;padding:2px 10px;margin-bottom:12px;letter-spacing:1px;
  }
  .fw-card h2{font-size:15px;font-weight:800}
  .fw-count{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:800;
    font-size:clamp(40px,8vw,60px);letter-spacing:-1px;line-height:1.1;margin-top:6px;
    background:linear-gradient(100deg,#0891B2,#2563EB);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .fw-count small{font-size:18px;color:var(--ink2);-webkit-text-fill-color:var(--ink2);letter-spacing:0;font-weight:400}
  .fw-date{font-size:12.5px;color:var(--ink2);margin-top:4px}
  .fw-date b{color:var(--ink)}
  .fw-bar{height:12px;border-radius:999px;background:#E2EAF5;margin-top:18px;overflow:hidden}
  .fw-bar i{
    display:block;height:100%;border-radius:999px;width:0;
    background:linear-gradient(90deg,#0891B2,#2563EB);
    box-shadow:0 0 14px rgba(8,145,178,.45);
    transition:width .6s var(--ease);
  }
  .fw-barrow{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
  .fw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .fw-grid div{
    background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:13px;
    padding:10px 8px;text-align:center;
  }
  .fw-grid b{
    display:block;font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;
    color:var(--cyan);font-variant-numeric:tabular-nums;
  }
  .fw-grid i{font-style:normal;font-size:10.5px;color:var(--ink3)}
  .fw-sens{
    margin-top:16px;background:rgba(255,255,255,.7);border:1px dashed rgba(15,23,42,.16);
    border-radius:13px;padding:12px 16px;font-size:12.5px;color:var(--ink2);
  }
  .fw-sens b{color:var(--cyan);font-family:ui-monospace,Menlo,monospace}
  .fw-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .fw-actions button{
    border:none;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;
    padding:11px 20px;cursor:pointer;transition:transform .25s var(--ease);
  }
  .fw-actions button:hover{transform:translateY(-2px)}
  .fw-copy{background:linear-gradient(135deg,#0891B2,#2563EB);color:#fff;
    box-shadow:0 10px 24px -10px rgba(8,145,178,.5)}
  .fw-note{margin-top:14px;font-size:11px;color:var(--ink3);line-height:1.8}
  .fw-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink3);text-align:center;line-height:2.1}
  .fw-foot a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}

  @media (max-width:560px){
    .fw-grid{grid-template-columns:1fr 1fr}
    .fw-grid div:last-child{grid-column:span 2}
  }
</style>
</head>
<body>
<div class="fw-wrap">

  <header class="fw-head">
    <a class="fw-back" href="https://zekes.top/portal.html">⌂ 泽克主页</a>
    <h1>FIRE 倒计时</h1>
    <p>「不上班还有多少天？」——按 <b>4% 法则</b>（存够年支出 × 25 即可靠提取利息生活）算出你的财务自由倒计时。数字存在本地，刷新不丢。</p>
  </header>

  <section class="fw-form">
    <div class="fw-field">
      <label><b>当前存款</b>（存款+理财+股票市值，合计）</label>
      <div class="row"><input type="number" id="p0" min="0" step="1000" placeholder="如 200000"><span class="unit">元</span></div>
    </div>
    <div class="fw-field">
      <label><b>每月支出</b>（不上班状态下也要花的钱）</label>
      <div class="row"><input type="number" id="exp" min="0" step="500" placeholder="如 6000"><span class="unit">元/月</span></div>
    </div>
    <div class="fw-field">
      <label><b>每月能存</b>（收入 − 支出）</label>
      <div class="row"><input type="number" id="pmt" min="0" step="500" placeholder="如 5000"><span class="unit">元/月</span></div>
    </div>
    <div class="fw-field">
      <label><b>年化收益率</b>（长期实际回报假设，默认 4%）</label>
      <div class="fw-slider">
        <input type="range" id="rate" min="0" max="10" step="0.5" value="4">
        <b id="rateV">4.0%</b>
      </div>
    </div>
  </section>

  <section class="fw-out" id="out"></section>

  <footer class="fw-foot">
    简化模型：不含通胀、税费与市场波动，结果仅供娱乐参考，不构成任何投资建议 ·
    <a href="https://zekes.top/challenge.html">52 周工具挑战 · W02</a><br>
    © 2026 泽克的数据笔记 · 皖ICP备<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">2026036657号</a>
  </footer>
</div>

<script>
var F = {
  p0: document.getElementById('p0'), exp: document.getElementById('exp'),
  pmt: document.getElementById('pmt'), rate: document.getElementById('rate'),
  rateV: document.getElementById('rateV'), out: document.getElementById('out')
};
var KEY = 'fire-v1';
try {
  var s = JSON.parse(localStorage.getItem(KEY));
  if (s) { F.p0.value = s.p0 || ''; F.exp.value = s.exp || ''; F.pmt.value = s.pmt || ''; F.rate.value = s.rate || 4; }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({
  p0:F.p0.value, exp:F.exp.value, pmt:F.pmt.value, rate:F.rate.value
})); } catch(e){} }
function fmt(n){ return Math.round(n).toLocaleString('zh-CN'); }

/* 数值解：几个月后 P0 复利 + 每月定投 ≥ 目标 */
function monthsTo(target, p0, pmt, rMonthly){
  if (p0 >= target) return 0;
  var m = 0, bal = p0;
  while (m < 12 * 80) {
    m++;
    bal = bal * (1 + rMonthly) + pmt;
    if (bal >= target) return m;
  }
  return -1;
}
function calc(){
  F.rateV.textContent = (+F.rate.value).toFixed(1) + '%';
  save();
  var p0 = Math.max(0, +F.p0.value || 0);
  var exp = Math.max(0, +F.exp.value || 0);
  var pmt = Math.max(0, +F.pmt.value || 0);
  var rate = Math.max(0, +F.rate.value || 0) / 100;

  if (!exp || (!p0 && !pmt)) {
    F.out.innerHTML = '<div class="fw-card"><span class="tag">COUNTDOWN</span><h2>填上左边三个数</h2>' +
      '<p class="fw-date">存款、月支出、每月能存——倒计时马上开始。</p></div>';
    return;
  }
  var target = exp * 12 * 25;
  var rM = rate / 12;
  var m = monthsTo(target, p0, pmt, rM);
  var yrs = m < 0 ? null : Math.floor(m / 12), mos = m % 12;
  var now = new Date();
  var eta = new Date(now.getFullYear(), now.getMonth() + m, now.getDate());
  var passive = p0 * rate / 12;
  var cover = exp ? (passive / exp * 100) : 0;
  var prog = Math.min(100, p0 / target * 100);
  var mPlus = monthsTo(target, p0, pmt + 500, rM);

  F.out.innerHTML =
    '<div class="fw-card">' +
      '<span class="tag">FIRE COUNTDOWN</span>' +
      '<h2>距离「不上班」还有</h2>' +
      '<div class="fw-count">' + (m < 0 ? '80<small> 年后…</small>' :
        (yrs > 0 ? yrs + '<small> 年 </small>' : '') + mos + '<small> 个月</small>') + '</div>' +
      '<div class="fw-date">预计 <b>' + (m < 0 ? '——' : eta.getFullYear() + ' 年 ' + (eta.getMonth()+1) + ' 月') +
      '</b> 达成 · 自由目标 <b>¥' + fmt(target) + '</b>（= 年支出 × 25）</div>' +
      '<div class="fw-bar"><i style="width:' + prog.toFixed(1) + '%"></i></div>' +
      '<div class="fw-barrow"><span>已存 ¥' + fmt(p0) + '</span><span>进度 ' + prog.toFixed(1) + '%</span></div>' +
      '<div class="fw-grid">' +
        '<div><b>¥' + fmt(target) + '</b><i>自由目标线</i></div>' +
        '<div><b>' + cover.toFixed(0) + '%</b><i>被动收入已覆盖月支出</i></div>' +
        '<div><b>¥' + fmt(passive) + '</b><i>存款每月替你赚</i></div>' +
      '</div>' +
      (m > 0 && mPlus > 0 && m - mPlus > 0 ?
        '<div class="fw-sens">🌶️ 每个月多存 ¥500，倒计时缩短 <b>' + (m - mPlus) + '</b> 个月（约 ' + ((m - mPlus) / 12).toFixed(1) + ' 年）</div>' : '') +
      (m === 0 ? '<div class="fw-sens">🎉 你已经越过自由线了——这只是一个模型，人生不止一种算法。</div>' : '') +
      '<div class="fw-actions"><button class="fw-copy" id="copyBtn">复制倒计时文案</button></div>' +
      '<p class="fw-note">4% 法则来自美股历史回报的粗略经验（Trinity 研究），不保证未来成立；本工具为教育演示，不构成投资建议。</p>' +
    '</div>';
  var cb = document.getElementById('copyBtn');
  if (cb) cb.addEventListener('click', function(){
    var txt = '【FIRE 倒计时】\n按 4% 法则，我距离「不上班」还有 ' +
      (m < 0 ? '80 年以上' : (yrs > 0 ? yrs + ' 年 ' : '') + mos + ' 个月') +
      '\n自由目标 ¥' + fmt(target) + ' · 已完成 ' + prog.toFixed(1) + '%\n存款每月替我赚 ¥' + fmt(passive) +
      '\n——来自「泽克的数据笔记」FIRE 倒计时';
    if (navigator.clipboard) navigator.clipboard.writeText(txt);
    this.textContent = '已复制 ✓'; var b = this; setTimeout(function(){ b.textContent = '复制倒计时文案'; }, 1800);
  });
}
['p0','exp','pmt'].forEach(function(id){ F[id].addEventListener('input', calc); });
F.rate.addEventListener('input', calc);
calc();
</script>
<script src="/track.js?v=1" defer></script>
</body>
</html>
