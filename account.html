<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户设置 · 高股息看板</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('gx-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>
<style>
  :root{
    color-scheme: light;
    --bg:#f6f7f9; --card:#ffffff; --card2:#fafbfc;
    --line:#e7e9ee; --line2:#f0f1f4;
    --t1:#171a20; --t2:#5a6070; --t3:#98a0ae;
    --brand:#0e9f6e; --brand-ink:#0b7f58; --brand-soft:rgba(14,159,110,.10);
    --up:#d92d3e; --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  html[data-theme=dark]{
    color-scheme: dark;
    --bg:#0b0e13; --card:#141922; --card2:#171d28;
    --line:#232a36; --line2:#1c222c;
    --t1:#e8ecf2; --t2:#9aa4b2; --t3:#5f6a7a;
    --brand:#34d399; --brand-ink:#6ee7b7; --brand-soft:rgba(52,211,153,.12);
    --up:#ff6b7a; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 50px}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:11px;
    padding:14px 0 12px;margin-bottom:16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#10b981,#0d8a6c);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
  h1{font-size:17px;font-weight:700}
  .spacer{flex:1}
  button.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:14px;font-weight:700;margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--t2)}
  .kv .v{font-weight:600}
  .kv .v.muted{color:var(--t3);font-weight:400}
  .kv .v.ok{color:var(--brand-ink)}
  input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:13px;color:var(--t1);outline:none;font-family:inherit;margin-bottom:10px}
  input:focus{border-color:var(--brand)}
  button.go{width:100%;background:linear-gradient(135deg,var(--brand),#0d9488);border:none;color:#fff;
    border-radius:10px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button.go:disabled{opacity:.55}
  button.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 16px;font-size:13px;color:var(--t2);cursor:pointer;font-family:inherit}
  button.ghost:hover{border-color:var(--up);color:var(--up)}
  .msg{font-size:12.5px;border-radius:8px;padding:8px 12px;margin-top:10px;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--brand-soft);color:var(--brand-ink)}
  .msg.err{background:rgba(217,45,62,.08);color:var(--up)}
  .note{font-size:12px;color:var(--t3);margin-top:8px;line-height:1.8}
  .loading{padding:60px 0;text-align:center;color:var(--t3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">息</div>
    <h1>账户设置</h1>
    <div class="spacer"></div>
    <a class="ghost" style="text-decoration:none" href="index.html">返回看板</a>
    <button class="iconbtn" id="themeBtn" title="切换明暗主题">🌙</button>
  </div>

  <div class="loading" id="loading">加载中…</div>

  <div id="main" style="display:none">
    <div class="card">
      <h2>账户信息</h2>
      <div class="kv"><span class="k">邮箱</span><span class="v" id="pEmail">—</span></div>
      <div class="kv"><span class="k">手机号</span><span class="v muted" id="pPhone">未绑定（短信通道开放后可绑定）</span></div>
      <div class="kv"><span class="k">密码登录</span><span class="v" id="pPw">—</span></div>
      <div class="kv"><span class="k">账号等级</span><span class="v" id="pTier">免费版（自选 5 只）</span></div>
    </div>

    <div class="card">
      <h2>股息率提醒</h2>
      <div class="note" style="margin:0 0 8px">已开启：自选股股息率上穿 <b>5.5%</b>（深度价值区）或 <b>5.0%</b>（关注区）时，邮件通知本账户邮箱；同一档位 7 天内不重复（交易时段每 10 分钟扫描）。</div>
      <div id="alertList"></div>
    </div>

    <div class="card">
      <h2 id="pwTitle">设置密码</h2>
      <input id="oldPw" type="password" placeholder="当前密码（首次设置可留空）" style="display:none">
      <input id="newPw" type="password" placeholder="新密码（8-64 位）" autocomplete="new-password">
      <input id="newPw2" type="password" placeholder="再输入一遍新密码">
      <button class="go" id="pwBtn">保存密码</button>
      <div class="msg ok" id="okMsg"></div>
      <div class="msg err" id="errMsg"></div>
      <div class="note">设置后可用「邮箱 + 密码」直接登录；修改密码会使所有已登录设备下线。</div>
    </div>

    <div class="card">
      <h2>其他</h2>
      <button class="ghost" id="logoutBtn">退出登录</button>
      <a class="ghost" id="adminLink" style="display:none;text-decoration:none;margin-left:8px" href="features.html">功能开关管理</a>
      <a class="ghost" id="labLink" style="display:none;text-decoration:none;margin-left:8px" href="lab.html">策略实验室</a>
      <a class="ghost" id="statsLink" style="display:none;text-decoration:none;margin-left:8px" href="stats.html">流量统计</a>
      <a class="ghost" id="adsLink" style="display:none;text-decoration:none;margin-left:8px" href="ads_admin.html">广告位管理</a>
      <div class="note">退出后自选数据保留，重新登录即可恢复。<br>皖ICP备<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">2026036657号</a></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const token = localStorage.getItem('gx-token') || '';

function go(msg, isErr){
  const el = isErr ? $('#errMsg') : $('#okMsg');
  $('#okMsg').classList.remove('show'); $('#errMsg').classList.remove('show');
  el.textContent = msg; el.classList.add('show');
}

async function loadAlerts(){
  try{
    const r = await fetch('/api/alerts', {headers: {'Authorization': 'Bearer ' + token}});
    if (!r.ok) return;
    const d = await r.json();
    const box = document.getElementById('alertList');
    box.innerHTML = d.items.length
      ? d.items.map(a => `<div class="kv"><span class="k">${a.name} 达到 ${a.tier}% 档</span><span class="v" style="font-weight:400;color:var(--t3)">${a.dy}% · ${a.at.slice(0, 10)}</span></div>`).join('')
      : '<div class="kv"><span class="k">暂无触发记录</span><span class="v" style="font-weight:400;color:var(--t3)">加自选后自动监控</span></div>';
  }catch(e){}
}

async function load(){
  if (!token){ location.href = 'index.html?login=1'; return; }
  try{
    const r = await fetch('/api/me', {headers: {'Authorization': 'Bearer ' + token}});
    if (!r.ok){ location.href = 'index.html?login=1'; return; }
    const d = await r.json();
    $('#pEmail').textContent = d.email || '—';
    $('#pPw').textContent = d.has_password ? '已启用' : '未设置';
    $('#pPw').className = 'v ' + (d.has_password ? 'ok' : 'muted');
    if (d.has_password){ $('#pwTitle').textContent = '修改密码'; $('#oldPw').style.display = ''; }
    if (d.role === 'admin'){ $('#adminLink').style.display = ''; $('#adsLink').style.display = ''; }
    if ((d.features || []).includes('lab.backtest')) $('#labLink').style.display = '';
    if ((d.features || []).includes('stats.views')) $('#statsLink').style.display = '';
    $('#loading').style.display = 'none';
    $('#main').style.display = '';
    loadAlerts();
  }catch(e){
    $('#loading').textContent = '网络异常，请刷新重试';
  }
}

$('#pwBtn').addEventListener('click', async () => {
  const old_password = $('#oldPw').value || null;
  const a = $('#newPw').value, b = $('#newPw2').value;
  if (a.length < 8 || a.length > 64){ go('密码需 8-64 位', true); return; }
  if (a !== b){ go('两次输入的新密码不一致', true); return; }
  $('#pwBtn').disabled = true;
  try{
    const r = await fetch('/api/auth/set-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({old_password, new_password: a})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '保存失败');
    localStorage.setItem('gx-token', d.token);  // 换新会话
    go('密码已保存');
    $('#oldPw').style.display = ''; $('#oldPw').value = '';
    $('#newPw').value = ''; $('#newPw2').value = '';
    $('#pwTitle').textContent = '修改密码';
    $('#pPw').textContent = '已启用'; $('#pPw').className = 'v ok';
  }catch(e){
    go(e.message, true);
  }finally{
    $('#pwBtn').disabled = false;
  }
});

$('#logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('gx-token'); localStorage.removeItem('gx-user');
  location.href = 'index.html';
});

$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = cur;
  try{ localStorage.setItem('gx-theme', cur); }catch(e){}
  $('#themeBtn').textContent = cur === 'dark' ? '☀️' : '🌙';
});
$('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';

load();
</script>
  <script src="track.js?v=1" defer></script>
</body>
</html>
