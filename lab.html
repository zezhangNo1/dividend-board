<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略实验室 · 历史回测</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('gx-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var q = new URLSearchParams(location.search).get('theme');
    if(q === 'dark' || q === 'light') t = q;
    document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(600px 300px at 15% -50px, var(--bg-glow), transparent);
    background-repeat:no-repeat}
  .wrap{max-width:980px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 60px}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;padding:12px 0 10px;margin-bottom:16px;
    background:var(--sticky);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#334155,#1e293b);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;font-weight:700}
  h1{font-size:17px;font-weight:700;letter-spacing:.3px}
  .sub{color:var(--t2);font-size:11px;margin-top:1px}
  .badge{background:var(--brand-soft);color:var(--brand-ink);border-radius:6px;
    padding:1px 8px;font-size:10.5px;font-weight:600}
  .spacer{flex:1}
  a.act{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:7px 13px;font-size:12.5px;color:var(--t2);text-decoration:none}
  a.act:hover{border-color:var(--brand);color:var(--t1)}

  .notice{background:var(--goldbg);border:1px solid var(--goldline);color:var(--gold);
    border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;line-height:1.7}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:clamp(16px,3vw,26px);margin-bottom:16px}
  .card h2{font-size:14.5px;margin-bottom:12px}

  .strat{border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    margin-bottom:10px;cursor:pointer;transition:border-color .12s}
  .strat:hover{border-color:var(--brand)}
  .strat.on{border-color:var(--brand);background:var(--brand-soft)}
  .strat .nm{font-weight:700;font-size:13.5px}
  .strat .ds{color:var(--t2);font-size:12px;margin-top:3px;line-height:1.65}
  .strat .key{color:var(--t3);font-size:10.5px;font-family:ui-monospace,Menlo,monospace;margin-top:4px}

  .ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .ctrl label{color:var(--t2);font-size:12px}
  select{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 10px;font-size:12.5px;color:var(--t1);font-family:inherit;outline:none}
  select:focus{border-color:var(--brand)}
  button.go{background:var(--brand);color:#fff;border:none;border-radius:10px;
    padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  button.go:disabled{opacity:.5;cursor:wait}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:11px 13px}
  .stat .k{font-size:11px;color:var(--t3);margin-bottom:3px}
  .stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;font-weight:500;color:var(--t3)}
  .pos{color:var(--brand-ink)} .neg{color:var(--up)}
  .stat.sub .v{font-size:14px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin:8px 2px 4px}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

  canvas{width:100%;height:300px;display:block;border-radius:10px}
  @media (max-width:640px){ canvas{height:230px} }

  .bars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;font-size:12px}
  .bar-row .track{height:9px;background:var(--line2);border-radius:6px;overflow:hidden}
  .bar-row .fill{height:100%;border-radius:6px}
  .bar-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

  .held{display:flex;gap:8px;flex-wrap:wrap}
  .held span{background:var(--card2);border:1px solid var(--line2);border-radius:8px;
    padding:4px 10px;font-size:12px}

  .msg{color:var(--t3);font-size:12.5px;padding:24px 0;text-align:center}
  .foot{color:var(--t3);font-size:10.5px;text-align:center;margin-top:20px;line-height:1.8}
</style>

<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">测</div>
    <div>
      <h1>策略实验室 <span class="badge">自用</span></h1>
      <div class="sub">红利主题策略历史回测 · 前复权口径</div>
    </div>
    <div class="spacer"></div>
    <a class="act" href="index.html">看板</a>
    <a class="act" href="ai.html">AI 观察</a>
  </div>

  <div class="notice">历史回测仅用于研究复盘：结果基于公开行情与分红数据、含费用近似，<b>不代表未来收益，不构成投资建议</b>。本页仅对授权账号开放。</div>

  <div id="denied" class="card msg" style="display:none">该功能未对你开放（需授权账号）</div>

  <div id="main" style="display:none">
    <div class="card">
      <h2>选择策略</h2>
      <div id="strats"></div>
      <div class="ctrl" id="paramBox" style="display:none">
        <label id="paramLabel"></label>
        <select id="paramSel"></select>
      </div>
      <div class="ctrl">
        <label>起始</label>
        <select id="startSel">
          <option>2018-01-01</option><option>2019-01-01</option><option>2020-01-01</option>
          <option>2021-01-01</option><option>2022-01-01</option><option>2023-01-01</option>
        </select>
        <button class="go" id="runBtn">运行回测</button>
        <span id="dataHint" style="font-size:11px;color:var(--t3)"></span>
      </div>
    </div>

    <div id="result" style="display:none">
      <div class="card">
        <h2 id="rTitle"></h2>
        <div class="stats" id="stats"></div>
        <div class="legend" id="legend"></div>
        <canvas id="chart"></canvas>
      </div>
      <div class="card" id="decompCard">
        <h2>收益构成（分红再投入贡献）</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="card" id="heldCard">
        <h2>最新一期持仓</h2>
        <div class="held" id="held"></div>
        <div class="msg" id="heldMeta" style="padding:8px 0 0;text-align:left"></div>
      </div>
    </div>

    <div class="msg" id="status">选择策略后点击「运行回测」</div>
  </div>

  <div class="foot">口径：前复权日线（含分红再投入）· 近12个月股息率=除息口径每股派息÷不复权价<br>
    数据来自公开接口，仅供个人研究 · 不构成投资建议</div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const token = localStorage.getItem('gx-token') || '';
const H = token ? {'Authorization': 'Bearer ' + token} : {};
const COLORS = {portfolio: '#0e9f6e', benchmark: '#b45309'};
let CUR = null, SEL = 'bank.dividend';

const fmt = v => (v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%');
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');

async function boot(){
  let feats = [];
  if (token){
    try{ const r = await fetch('/api/me', {headers: H}); if (r.ok) feats = (await r.json()).features || []; }catch(e){}
  }
  if (!feats.includes('lab.backtest')){ $('#denied').style.display = ''; return; }
  $('#main').style.display = '';
  let list = [];
  try{ const r = await fetch('/api/lab/strategies', {headers: H}); list = (await r.json()).strategies || []; }catch(e){}
  $('#strats').innerHTML = list.map(s => `
    <div class="strat" data-k="${s.key}" onclick="pick('${s.key}')">
      <div class="nm">${s.name}</div>
      <div class="ds">${s.desc}</div>
      <div class="key">${s.key}</div>
    </div>`).join('');
  try{
    const r = await fetch('/api/lab/data/status', {headers: H});
    if (r.ok){ const d = await r.json(); $('#dataHint').textContent =
      `行情缓存 ${d.kline_cached} 只 · 分红 ${d.div_cached} 只 · 最新 ${d.last_bar || '—'}`; }
  }catch(e){}
  if (list.length) pick(list[0].key);
}

function pick(k){
  SEL = k;
  document.querySelectorAll('.strat').forEach(el => el.classList.toggle('on', el.dataset.k === k));
  fetch('/api/lab/strategies', {headers: H}).then(r => r.json()).then(d => {
    const s = (d.strategies || []).find(x => x.key === k);
    const p = s && s.params && s.params[0];
    $('#paramBox').style.display = p ? '' : 'none';
    if (p){
      $('#paramLabel').textContent = p.label + '：';
      $('#paramSel').innerHTML = p.options.map(o =>
        `<option ${o === p.default ? 'selected' : ''}>${o}</option>`).join('');
    }
  });
}

async function run(){
  const btn = $('#runBtn'); btn.disabled = true; btn.textContent = '回测中…';
  $('#status').style.display = '';
  $('#status').textContent = '回测中…';
  $('#result').style.display = 'none';
  try{
    const body = {strategy: SEL, start: $('#startSel').value};
    if ($('#paramBox').style.display !== 'none') body.threshold = $('#paramSel').value;
    const r = await fetch('/api/lab/backtest', {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H},
      body: JSON.stringify(body)});
    const d = await r.json();
    if (r.status === 404 || !d.ok){ $('#status').textContent = d.message || '该功能未开放'; return; }
    render(d); $('#status').style.display = 'none';
  }catch(e){
    $('#status').textContent = '网络异常：' + e.message;
  }finally{
    btn.disabled = false; btn.textContent = '运行回测';
  }
}

function render(d){
  CUR = d;
  $('#result').style.display = '';
  $('#rTitle').textContent = `${d.name}（${d.start} ~ ${d.end}）`;
  const mp = d.metrics.portfolio || {}, mb = d.metrics.benchmark || {};
  const isCompare = d.mode === 'compare';
  const m1 = isCompare ? (d.metrics['红利ETF'] || {}) : mp;
  const m2 = isCompare ? (d.metrics['沪深300ETF'] || {}) : mb;
  $('#stats').innerHTML = [
    stat(isCompare ? '红利ETF 总收益' : '策略总收益', m1.total, true),
    stat(isCompare ? '红利ETF 年化' : '策略年化', m1.cagr, true),
    stat(isCompare ? '沪深300ETF 总收益' : '基准总收益', m2.total),
    stat(isCompare ? '沪深300ETF 年化' : '基准年化', m2.cagr),
    stat('策略最大回撤', m1.mdd), stat('策略波动率', m1.vol),
    stat('夏普比率', m1.sharpe, false, true), stat('区间年数', m1.years, false, true),
  ].join('');
  const legend = isCompare
    ? [['红利ETF', COLORS.portfolio], ['沪深300ETF', COLORS.benchmark]]
    : [['策略净值', COLORS.portfolio], ['沪深300', COLORS.benchmark]];
  $('#legend').innerHTML = legend.map(([n, c]) =>
    `<span><i style="background:${c}"></i>${n}</span>`).join('');
  drawChart(d);
  if (isCompare){ $('#decompCard').style.display = 'none'; }
  else {
    $('#decompCard').style.display = '';
    const dc = d.decomposition || {};
    const scale = Math.max(Math.abs(dc.total || 0), Math.abs(dc.price_only || 0), Math.abs(dc.div_reinvest || 0), 1);
    $('#bars').innerHTML = [
      bar('总收益（含分红再投）', dc.total, scale, '#0e9f6e'),
      bar('价格收益（不含分红）', dc.price_only, scale, '#7fb0f5'),
      bar('分红再投入贡献', dc.div_reinvest, scale, '#b45309'),
    ].join('');
  }
  if (d.last_held && d.last_held.length){
    $('#heldCard').style.display = '';
    $('#held').innerHTML = d.last_held.map(h => `<span>${h.name} <i style="font-style:normal;color:var(--t3)">${h.code}</i></span>`).join('');
    $('#heldMeta').textContent = `共 ${d.rebalances} 次再平衡 · 数据截至 ${d.end}`;
  } else { $('#heldCard').style.display = 'none'; }
}

const stat = (k, v, signed, plain) =>
  `<div class="stat"><div class="k">${k}</div><div class="v ${plain ? '' : cls(v)}">${plain ? (v ?? '—') : fmt(v)}</div></div>`;
const bar = (k, v, scale, c) => `
  <div class="bar-row"><span>${k}</span>
    <div class="track"><div class="fill" style="width:${Math.max(1, Math.abs(v) / scale * 100)}%;background:${c}"></div></div>
    <span class="num ${cls(v)}">${fmt(v)}</span></div>`;

function drawChart(d){
  const cv = $('#chart'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, Hh = 300;
  cv.width = W * dpr; cv.height = Hh * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, Hh);
  const pad = {l: 44, r: 12, t: 10, b: 22};
  const series = d.mode === 'compare'
    ? [['红利ETF', d.curves['红利ETF']], ['沪深300ETF', d.curves['沪深300ETF']]]
    : [['portfolio', d.curves.portfolio], ['benchmark', d.curves.benchmark]];
  let lo = Infinity, hi = -Infinity, t0 = '', t1 = '';
  series.forEach(([, pts]) => pts.forEach(([dt, v]) => {
    lo = Math.min(lo, v); hi = Math.max(hi, v);
    if (!t0 || dt < t0) t0 = dt; if (dt > t1) t1 = dt;
  }));
  const span = Math.max(hi - lo, 1e-9);
  lo -= span * .05; hi += span * .05;
  const X = i => pad.l + (i / 400) * (W - pad.l - pad.r);
  const Y = v => Hh - pad.b - ((v - lo) / (hi - lo)) * (Hh - pad.t - pad.b);
  const css = getComputedStyle(document.documentElement);
  const gridC = css.getPropertyValue('--line2').trim() || '#eee';
  const t3 = css.getPropertyValue('--t3').trim() || '#999';
  ctx.strokeStyle = gridC; ctx.fillStyle = t3; ctx.font = '10px system-ui'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++){
    const v = lo + (hi - lo) * g / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(2), 4, y + 3);
  }
  ctx.fillText(t0.slice(0, 7), pad.l, Hh - 6);
  ctx.textAlign = 'right'; ctx.fillText(t1.slice(0, 7), W - pad.r, Hh - 6); ctx.textAlign = 'left';
  series.forEach(([name, pts], si) => {
    ctx.strokeStyle = si === 0 ? COLORS.portfolio : COLORS.benchmark;
    ctx.lineWidth = si === 0 ? 2 : 1.3;
    ctx.beginPath();
    pts.forEach(([dt, v], i) => {
      const idx = Math.round(i / Math.max(pts.length - 1, 1) * 400);
      const x = X(idx), y = Y(v);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  });
}

$('#runBtn').addEventListener('click', run);
window.addEventListener('resize', () => { if (CUR) drawChart(CUR); });
boot();
</script>

</body>
